name: Home Windows — validar Faber (PR)
on:
  pull_request:
    paths:
      - 'home*.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/windows-check.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install --upgrade -r requirements.txt
      - name: Verificar sintaxe
        run: python -m py_compile home.py home_voice.py home_faber.py home_groq.py home_emotions.py home_chat_store.py home_assistant.py home_integrations.py
      - name: Executar testes sem baixar modelos
        run: python -m unittest discover -s tests -v
      - name: Verificar áudio REAL sintetizado pela Faber (sem alto-falante)
        shell: pwsh
        run: |
          @'
          from home_faber import FaberDownloadWorker, installed, synthesize
          import numpy as np
          worker=FaberDownloadWorker()
          worker.run()
          assert installed(), "Faber não foi instalada no teste"
          samples, sample_rate=synthesize("Marinha sem vento não chega a porto")
          samples=np.asarray(samples)
          assert sample_rate >= 16000, "Taxa de amostragem inválida"
          assert samples.size > sample_rate//2, "A síntese gerou áudio vazio/curto"
          assert np.max(np.abs(samples)) > 0.001, "Áudio silencioso"
          print(f"Faber validada: {samples.size} amostras, {sample_rate} Hz")
          '@ | Set-Content faber_audio_check.py -Encoding utf8
          python faber_audio_check.py
      - name: Confirmar configuração Groq dentro do HOME (sem popup)
        shell: pwsh
        run: |
          @'
          from unittest.mock import patch
          from PySide6.QtWidgets import QApplication
          from home import Home
          app=QApplication([])
          home=Home()
          home.show()
          home.navigate("assistant")
          home.animation.setCurrentTime(300)
          app.processEvents()
          panel=home.workspace.current
          assert not panel.groq_panel.isVisible()
          panel.configure_groq()
          assert panel.groq_panel.isVisible()
          panel.groq_input.setText("gsk_" + "a"*30)
          with patch("home_assistant.save_key") as store:
              panel.save_groq_inline()
              store.assert_called_once()
          assert not panel.groq_panel.isVisible()
          assert not panel.groq_input.text()
          home.shutdown()
          print("Groq: campo visível no HOME, salvo sem QInputDialog.")
          '@ | Set-Content inline_groq_check.py -Encoding utf8
          python inline_groq_check.py
      - name: Testar página de voz Faber
        shell: pwsh
        run: |
          @'
          from PySide6.QtWidgets import QApplication
          from home import Home
          from home_faber import MODEL_NAME, installed
          app=QApplication([])
          home=Home()
          home.show()
          home.toggle()
          home.navigate("voice")
          home.animation.setCurrentTime(300)
          app.processEvents()
          assert home.page=="voice"
          page=home.workspace.current
          assert hasattr(page, "faber_button")
          assert hasattr(page, "preview_button")
          assert page.rate_slider.value()>=90
          assert MODEL_NAME=="vits-piper-pt_BR-faber-medium"
          assert not installed() or page.faber_button is not None
          home.shutdown()
          print("Voz Faber integrada ao Home Windows.")
          '@ | Set-Content voice_check.py -Encoding utf8
          python voice_check.py
