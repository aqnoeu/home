name: HOME Android — verificação de mudanças
on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-verify.yml'
permissions:
  contents: read
jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar sherpa-onnx fixado
        run: bash android/prepare-sherpa.sh
      - name: Compilar Android sem publicar
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
