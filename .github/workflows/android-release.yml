name: Home Android — publicação oficial
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: home-android-release
  cancel-in-progress: false
jobs:
  signed-release:
    runs-on: ubuntu-latest
    env:
      HOME_KEYSTORE_PASSWORD: ${{ secrets.HOME_ANDROID_KEYSTORE_PASSWORD }}
      HOME_KEY_ALIAS: ${{ secrets.HOME_ANDROID_KEY_ALIAS }}
      HOME_KEY_PASSWORD: ${{ secrets.HOME_ANDROID_KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.HOME_ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Preparar motor Faber offline
        run: bash android/prepare-sherpa.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Exigir assinatura estável (nunca publicar debug)
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$HOME_KEYSTORE_PASSWORD" ] || [ -z "$HOME_KEY_ALIAS" ] || [ -z "$HOME_KEY_PASSWORD" ]; then
            echo "::error::Configure os quatro secrets HOME_ANDROID_* no repositório para publicar APK atualizável"
            exit 1
          fi
      - name: Preparar assinatura protegida
        env:
          HOME_KEYSTORE_PATH: ${{ runner.temp }}/home-android.keystore
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME_KEYSTORE_PATH"
          echo "HOME_KEYSTORE_PATH=$HOME_KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Compilar release assinada
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease
      - name: Preparar APK e checksum
        shell: bash
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/Home-Android.apk
          cd release
          sha256sum Home-Android.apk > Home-Android.sha256
          echo "VERSION=$(grep -oE 'versionName = "[0-9]+\.[0-9]+\.[0-9]+"' ../android/app/build.gradle.kts | head -1 | cut -d '"' -f2)" >> "$GITHUB_ENV"
      - name: Validar versão e evitar sobrescrever release existente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$VERSION"
          if gh release view "android-v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Tag android-v$VERSION já existe; incremente a versão antes de publicar."
            exit 1
          fi
      - name: Publicar APK Android independente das releases Windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v$VERSION" release/Home-Android.apk release/Home-Android.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "Home Android v$VERSION" \
            --notes "APK oficial Android assinado. Atualizações são verificadas dentro do aplicativo. A instalação requer confirmação do Android." \
            --target "$GITHUB_SHA"
