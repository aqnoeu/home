name: Home — build e Release automatica
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-release.yml'
      - 'home.py'
      - 'home_navigation.py'
      - 'home_assistant.py'
      - 'home_ui.py'
      - 'home_integrations.py'
      - 'home_voice.py'
      - 'home_groq.py'
      - 'home_faber.py'
      - 'assets/**'
      - 'tests/**'
      - 'chrome-extension/**'
      - 'update_service.py'
      - 'updater.py'
      - 'requirements.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: home-release-main
  cancel-in-progress: false
jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Calcular proxima versao e embutir no aplicativo
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Android e Windows publicam no mesmo repositorio; tags Android nao sao versoes Windows.
          $tags = gh release list --repo "$env:GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) { throw 'Nao foi possivel consultar as Releases oficiais' }
          $current = $tags | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } | Select-Object -First 1
          if (-not $current) {
            $version = [version]'0.7.1'
          } else {
            $version = [version]($current.Substring(1))
            $version = [version]::new($version.Major, $version.Minor, $version.Build + 1)
          }
          $next = $version.ToString(3)
          "RELEASE_VERSION=$next" >> $env:GITHUB_ENV
          $source = Get-Content update_service.py -Raw
          $patched = $source -replace "VERSION = '\d+\.\d+\.\d+'", "VERSION = '$next'"
          if ($patched -eq $source -and $source -notmatch "VERSION = '$([regex]::Escape($next))'") {
            throw 'Nao foi possivel atualizar a versao interna'
          }
          Set-Content update_service.py -Value $patched -Encoding utf8
          Write-Host "Versao a publicar: $next"
      - name: Instalar dependencias
        run: python -m pip install --upgrade -r requirements.txt pyinstaller
      - name: Verificar sintaxe
        run: python -m py_compile home.py home_ui.py home_navigation.py home_assistant.py home_integrations.py home_voice.py home_faber.py home_groq.py updater.py update_service.py
      - name: Testar comandos de voz e wake word
        run: python -m unittest discover -s tests -v
      - name: Verificar áudio REAL sintetizado pela Faber (sem alto-falante)
        shell: pwsh
        run: |
          @'
          from home_faber import FaberDownloadWorker, installed, synthesize
          import numpy as np
          worker=FaberDownloadWorker()
          worker.run()
          assert installed(), "Faber não foi instalada no teste"
          samples, sample_rate=synthesize("Marinha sem vento não chega a porto")
          samples=np.asarray(samples)
          assert sample_rate >= 16000, "Taxa de amostragem inválida"
          assert samples.size > sample_rate//2, "A síntese gerou áudio vazio/curto"
          assert np.max(np.abs(samples)) > 0.001, "Áudio silencioso"
          print(f"Faber validada: {samples.size} amostras, {sample_rate} Hz")
          '@ | Set-Content faber_audio_check.py -Encoding utf8
          python faber_audio_check.py
      - name: Testar navegacao interna sem popups
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          @'
          from PySide6.QtWidgets import QApplication
          from home import Home
          app=QApplication([])
          home=Home()
          home.show()
          home.toggle()
          for section in ('assistant','voice','integrations','edit','updates','exit'):
              home.navigate(section)
              home.animation.setCurrentTime(300)
              app.processEvents()
              assert home.page == section
              assert home.workspace.current is not None
              assert not home.workspace.current.isWindow(), section
              assert home.width() >= 380
          home.navigate('assistant')
          page=home.workspace.current
          spoken=[]
          home.voice.speak=lambda msg,force=False: spoken.append((msg,force))
          page.entry.setText('teste de voz')
          page.send()
          assert spoken and spoken[-1][1] is True
          assert any('Não preciso do microfone' in msg for role,msg in home.assistant_history if role=='home')
          home.navigate('voice')
          voice_page = home.workspace.current
          assert voice_page.faber_button is not None
          assert voice_page.preview_button is not None
          assert voice_page.rate_slider.value() >= 90
          voice_page.rate_slider.setValue(190)
          voice_page.volume_slider.setValue(65)
          assert home.integration_prefs['voice_rate'] == 190
          assert home.integration_prefs['voice_volume'] == 65
          home.navigate('hub')
          assert home.page == 'hub'
          home.collapse()
          assert not home.expanded
          home.shutdown()
          print('Navegacao integrada verificada.')
          '@ | Set-Content navigation_smoke.py -Encoding utf8
          python navigation_smoke.py
      - name: Preparar ícone aprovado do Home
        shell: pwsh
        run: |
          python -m pip install pillow
          @'
          from PIL import Image
          img = Image.open("assets/home_icon_approved.png").convert("RGBA")
          img.save("assets/home_icon.ico", format="ICO",
                   sizes=[(16,16),(32,32),(48,48),(64,64),(128,128)])
          '@ | python
      - name: Compilar Home
        run: pyinstaller --noconfirm --clean --onefile --windowed --collect-all vosk --collect-binaries sounddevice --hidden-import sounddevice --collect-all sherpa_onnx --collect-all keyring --add-data "assets/home_icon_approved.png;assets" --icon assets/home_icon.ico --name Home home.py
      - name: Verificar biblioteca nativa Vosk no Home.exe
        shell: pwsh
        run: |
          $contents = (pyi-archive_viewer -l dist/Home.exe | Out-String)
          if ($contents -notmatch 'libvosk[.]dll') {
            throw 'O executavel nao contem vosk/libvosk.dll; compilacao bloqueada.'
          }
          Write-Host 'Vosk DLL incluida no executavel.'
      - name: Compilar atualizador
        run: pyinstaller --noconfirm --clean --onefile --windowed --name HomeUpdater updater.py
      - name: Empacotar e calcular hash
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path dist/Home.exe,dist/HomeUpdater.exe -DestinationPath release/Home-Windows.zip -Force
          Compress-Archive -Path chrome-extension/* -DestinationPath release/Home-Chrome-Extension.zip -Force
          $hash = (Get-FileHash release/Home-Windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Home-Windows.zip" | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - name: Disponibilizar pacote para teste mesmo sem Release
        uses: actions/upload-artifact@v4
        with:
          name: Home-Windows-candidato
          path: |
            release/Home-Windows.zip
            release/Home-Chrome-Extension.zip
            release/SHA256SUMS.txt
          retention-days: 14
      - name: Publicar Release automaticamente
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$env:RELEASE_VERSION" release/Home-Windows.zip release/Home-Chrome-Extension.zip release/SHA256SUMS.txt --repo "$env:GITHUB_REPOSITORY" --title "Home v$env:RELEASE_VERSION" --generate-notes --target "$env:GITHUB_SHA"
