name: HOME — release conjunta Windows e Android
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-release.yml'
      - 'android/**'
      - 'home.py'
      - 'home_*.py'
      - 'update_service.py'
      - 'updater.py'
      - 'requirements.txt'
      - 'assets/**'
      - 'tests/**'
      - 'chrome-extension/**'
      - 'release-request/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: home-unified-release
  # Serialize signed releases; never cancel Android/Windows packaging mid-build.
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.next.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar origem da versão solicitada
        run: |
          test -f android/app/build.gradle.kts
          test -f home_expression_gallery.py
          test -f docs/MANUAL_EXPRESSOES_HOME.md
          test -f android/app/src/main/java/com/aqnoeu/home/WakePhrases.java
          echo "OK: base da versão conjunta, galeria de 12 expressões e ativação por voz presentes."
      - name: Definir mesma versão para PC e celular
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName')
          previous=$(printf '%s\n' "$tags" | grep -E '^v2\.0\.[0-9]+$' | sed 's/^v2\.0\.//' | sort -n | tail -1 || true)
          if [ -z "$previous" ]; then patch=0; else patch=$((previous+1)); fi
          number="2.0.$patch"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "Versão compartilhada: $number"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar versão compartilhada no Windows
        shell: pwsh
        env:
          HOME_RELEASE_VERSION: ${{ needs.version.outputs.number }}
        run: |
          $source = Get-Content update_service.py -Raw
          $source = $source -replace "VERSION = '\d+\.\d+\.\d+'", "VERSION = '$env:HOME_RELEASE_VERSION'"
          Set-Content update_service.py -Value $source -Encoding utf8
          if (-not (Select-String -Path update_service.py -SimpleMatch "VERSION = '$env:HOME_RELEASE_VERSION'")) {
            throw 'Versao Windows nao aplicada'
          }
      - name: Instalar dependências
        run: python -m pip install --upgrade -r requirements.txt pyinstaller pillow
      - name: Verificar sintaxe de todos os módulos Windows
        run: python -m compileall -q home_device.py home_groq_client.py home.py home_ui.py home_navigation.py home_assistant.py home_integrations.py home_voice.py home_voice_profile.py home_account.py home_faber.py home_groq.py home_emotions.py home_expression_gallery.py home_eyes.py home_chat_store.py updater.py update_service.py
      - name: Validar componentes de voz e expressoes da release
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from home_expression_gallery import EXPRESSIONS
          assert len(EXPRESSIONS) == 12, "As 12 expressoes nao chegaram ao pacote Windows"
          source=Path("home_voice.py").read_text(encoding="utf-8")
          assert "roumi" in source and "wake_command" in source, "Ativacao por voz Windows ausente"
          android=Path("android/app/src/main/java/com/aqnoeu/home")
          wake=(android/"WakePhrases.java").read_text(encoding="utf-8")
          eyes=(android/"EyesView.java").read_text(encoding="utf-8")
          activity=(android/"MainActivity.java").read_text(encoding="utf-8")
          assert "roumi" in wake and "bareSuffix" in wake, "Voz Android incompleta"
          assert "EXPRESSION_LABELS" in eyes and "lovabow" in eyes, "Olhos Android incompletos"
          assert activity.count("addExpressionPicker(face,eyes,prefs)") == 2, "Galerias Android incompletas"
          print("OK: voz Android/Windows e 12 expressoes presentes")
          '@ | python
      - name: Testar chat, credenciais, voz e Groq simulada
        run: python -m unittest discover -s tests -v
      - name: Testar interface Windows sem display físico
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          @'
          from PySide6.QtWidgets import QApplication
          from home import Home
          app=QApplication([])
          home=Home()
          home.show()
          home.toggle()
          for section in ("assistant","voice","integrations","expressions","edit","updates","exit"):
              home.navigate(section)
              home.animation.setCurrentTime(300)
              app.processEvents()
              assert home.page == section
              assert home.workspace.current is not None
          home.navigate("expressions")
          gallery=home.workspace.current
          from home_expression_gallery import EXPRESSIONS
          assert len(EXPRESSIONS)==12
          gallery.change_page(1)
          assert gallery.page==1
          gallery.select(5)
          assert gallery.preview.current_expression()=="lovabow"
          home.navigate("assistant")
          page=home.workspace.current
          spoken=[]
          home.voice.speak=lambda msg,force=False: spoken.append((msg,force))
          page.entry.setText("teste de voz")
          page.send()
          assert spoken
          home.navigate("hub")
          home.shutdown()
          '@ | Set-Content navigation_smoke.py -Encoding utf8
          python navigation_smoke.py
      - name: Gerar ícone Windows
        shell: pwsh
        run: |
          @'
          from PIL import Image
          im=Image.open("assets/home_icon_approved.png").convert("RGBA")
          im.save("assets/home_icon.ico",format="ICO",sizes=[(16,16),(32,32),(48,48),(64,64),(128,128)])
          '@ | python
      - name: Compilar Home e atualizador
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --collect-all vosk --collect-binaries sounddevice --hidden-import sounddevice --collect-all sherpa_onnx --collect-all keyring --hidden-import home_expression_gallery --add-data "assets/home_icon_approved.png;assets" --icon assets/home_icon.ico --name Home home.py
          if ($LASTEXITCODE -ne 0) { throw "Compilação Windows falhou" }
          pyinstaller --noconfirm --clean --onefile --windowed --name HomeUpdater updater.py
          if ($LASTEXITCODE -ne 0) { throw "Atualizador Windows falhou" }
      - name: Verificar dependência Vosk
        shell: pwsh
        run: |
          $contents=(pyi-archive_viewer -l dist/Home.exe | Out-String)
          if ($contents -notmatch 'libvosk[.]dll') { throw 'DLL Vosk ausente do Home.exe' }
      - name: Preparar pacotes Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path dist/Home.exe,dist/HomeUpdater.exe -DestinationPath release/Home-Windows.zip -Force
          Compress-Archive -Path chrome-extension/* -DestinationPath release/Home-Chrome-Extension.zip -Force
          $hash=(Get-FileHash release/Home-Windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Home-Windows.zip" | Set-Content release/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: home-windows
          path: release/*
          retention-days: 14

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      HOME_RELEASE_VERSION: ${{ needs.version.outputs.number }}
      HOME_KEYSTORE_PASSWORD: ${{ secrets.HOME_ANDROID_KEYSTORE_PASSWORD }}
      HOME_KEY_ALIAS: ${{ secrets.HOME_ANDROID_KEY_ALIAS }}
      HOME_KEY_PASSWORD: ${{ secrets.HOME_ANDROID_KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.HOME_ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar motor de voz Faber para Android
        run: bash android/prepare-sherpa.sh
      - name: Validar cadastro Groq e gerenciador de expressões antes do build
        run: |
          python - <<'PY'
          from pathlib import Path
          base=Path("android/app/src/main/java/com/aqnoeu/home")
          activity=(base/"MainActivity.java").read_text()
          account=(base/"HomeHubAccount.java").read_text()
          emotion=(base/"HomeEmotion.java").read_text()
          eyes=(base/"EyesView.java").read_text()
          assert "showConnectionSettings(groq,groqSettingsHost)" in activity, "Cadastro Groq não abre na aba Voz / IA"
          assert "restoreGroqFromAccount();" in activity, "Restauração automática não iniciada"
          assert "account.backupGroqKey(key)" in activity, "Backup após login ausente"
          assert all(t in account for t in ("home_save_groq_key", "home_get_groq_key", "home_delete_groq_key"))
          assert all(t in emotion for t in ("bateria_baixa", "carregando", "emotion_"))
          assert "addEmotionSwitch(manager" in activity and "Gerenciar expressões e reações" in activity
          assert "Color.rgb(45,220,112)" in eyes, "Olhos verdes durante conversa ausentes"
          print("OK: Groq, conta HOME e gerenciador de expressões")
          PY
      - name: Compilar e validar código Android antes da assinatura
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verificar certificado oficial de atualização
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$HOME_KEYSTORE_PASSWORD" ] || [ -z "$HOME_KEY_ALIAS" ] || [ -z "$HOME_KEY_PASSWORD" ]; then
            echo "::error::Android compilou, mas publicação assinada bloqueada: faltam os quatro secrets HOME_ANDROID_*. Conserve a assinatura original para permitir atualização."
            exit 1
          fi
      - name: Restaurar certificado protegido
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/home-android.keystore"
          echo "HOME_KEYSTORE_PATH=$RUNNER_TEMP/home-android.keystore" >> "$GITHUB_ENV"
      - name: Compilar APK assinado na mesma versão
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Empacotar APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/Home-Android.apk
          cd release
          sha256sum Home-Android.apk > Home-Android.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: home-android
          path: release/*
          retention-days: 14

  legacy_bridge:
    # Existing v2.0.0 may already be published before this bridge was added.
    # This job does not depend on recompiling or repackaging Android.
    runs-on: ubuntu-latest
    steps:
      - name: Habilitar atualização dos Android 0.1.x já instalados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view android-v2.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Ponte legada v2.0.0 já disponível"
            exit 0
          fi
          if ! gh release view v2.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v2.0.0 ainda não publicada; ponte será tratada pelo próximo release."
            exit 0
          fi
          mkdir -p /tmp/home-bridge
          gh release download v2.0.0 --repo "$GITHUB_REPOSITORY" \
            --pattern 'Home-Android.apk' --dir /tmp/home-bridge
          test -s /tmp/home-bridge/Home-Android.apk
          gh release create android-v2.0.0 \
            /tmp/home-bridge/Home-Android.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "HOME Android — ponte para v2.0.0" \
            --notes "Mesmo APK Android assinado da versão unificada v2.0.0. Publicação de compatibilidade com atualizadores 0.1.x." \
            --target "$GITHUB_SHA"

  publish:
    needs: [version, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: home-windows
          path: dist/windows
      - uses: actions/download-artifact@v4
        with:
          name: home-android
          path: dist/android
      - name: Publicar uma única versão com os dois aplicativos
        env:
          GH_TOKEN: ${{ github.token }}
          HOME_RELEASE_VERSION: ${{ needs.version.outputs.number }}
        run: |
          set -euo pipefail
          test -s dist/windows/Home-Windows.zip
          test -s dist/windows/SHA256SUMS.txt
          test -s dist/android/Home-Android.apk
          test -s dist/android/Home-Android.sha256
          gh release create "v$HOME_RELEASE_VERSION" \
            dist/windows/Home-Windows.zip \
            dist/windows/Home-Chrome-Extension.zip \
            dist/windows/SHA256SUMS.txt \
            dist/android/Home-Android.apk \
            dist/android/Home-Android.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "HOME v$HOME_RELEASE_VERSION — Versão corrigida (Windows e Android)" \
            --notes "Versão corrigida: Groq sincronizada pelo login da Conta HOME com armazenamento criptografado no Supabase Vault (o primeiro cadastro da chave continua necessário quando não há backup anterior); restauração automática após reinstalação; Android com gerenciador de expressões individuais (ativar, ocultar e restaurar), prioridade corrigida para bateria fraca e carregamento, olhos verdes durante conversa; correções Android e Windows. APK assinado, Windows ZIP e SHA-256. Código-fonte: $GITHUB_SHA." \
            --target "$GITHUB_SHA"
      - name: Publicar ponte de atualização para Android 0.1.x
        env:
          GH_TOKEN: ${{ github.token }}
          HOME_RELEASE_VERSION: ${{ needs.version.outputs.number }}
        run: |
          set -euo pipefail
          # Older Android APKs only recognize android-vX.Y.Z release tags.
          # Publish the IDENTICAL signed APK under a legacy discovery tag.
          # Its internal Android versionName/versionCode remain 2.0.x.
          legacy_tag="android-v$HOME_RELEASE_VERSION"
          if gh release view "$legacy_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Ponte Android já existe: $legacy_tag"
          else
            gh release create "$legacy_tag" \
              dist/android/Home-Android.apk \
              dist/android/Home-Android.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "HOME Android — ponte para v$HOME_RELEASE_VERSION" \
              --notes "Canal de compatibilidade para atualizadores Android 0.1.x. Mesmo APK assinado da versão conjunta v$HOME_RELEASE_VERSION; não constitui uma versão diferente." \
              --target "$GITHUB_SHA"
          fi
